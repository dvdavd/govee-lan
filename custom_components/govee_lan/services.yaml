delete_matrix_scene:
  name: Delete matrix scene
  description: >
    Delete a saved H6022 matrix scene preset from the effect list.
  target:
    entity:
      domain: light
      integration: govee_lan
  fields:
    name:
      name: Name
      description: Exact preset name to delete.
      required: true
      example: "My Pixel Scene"
      selector:
        text:
